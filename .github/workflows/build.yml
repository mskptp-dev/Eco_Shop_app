name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/29.0.14206865
          sudo rm -rf /usr/local/lib/android/sdk/ndk/28.2.13676358
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Add swap space
        run: |
          sudo fallocate -l 10G /extra_swapfile
          sudo chmod 600 /extra_swapfile
          sudo mkswap /extra_swapfile
          sudo swapon /extra_swapfile
          free -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake

      - name: Install buildozer and cython
        run: |
          pip3 install --upgrade buildozer cython virtualenv

      - name: Build APK
        run: |
          export MAKEFLAGS="-j1"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecoshop-register-apk
          path: bin/*.apk
